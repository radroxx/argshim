[package]
name = "argshim"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Transparent process wrapper that rewrites command-line arguments and environment variables using declarative YAML rules"
license = "MIT"
repository = "https://github.com/your-name/argshim"
readme = "README.md"
keywords = ["wrapper", "shim", "cli", "environment", "arguments"]
categories = ["command-line-utilities"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
